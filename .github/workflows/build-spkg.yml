name: Build and test STranslate plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore plugin
        run: dotnet restore STranslate.Plugin.Translate.OpenAICompetitive.csproj
      - name: Protocol regression tests
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj --configuration Release
      - name: Windows plugin integration tests
        run: dotnet run --project tests/PluginTests/PluginTests.csproj --configuration Release
      - name: Packaging regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Publish plugin
        run: dotnet publish STranslate.Plugin.Translate.OpenAICompetitive.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Create and validate plugin package
        run: python scripts/package.py --source artifacts/publish --output artifacts/STranslate.Plugin.Translate.OpenAICompetitive.spkg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAICompetitive-${{ github.sha }}
          path: |
            artifacts/*.spkg
            artifacts/*.sha256
          if-no-files-found: error
